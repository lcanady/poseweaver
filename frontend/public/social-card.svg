<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="2" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="1100" cy="530" r="3" fill="#06b6d4" opacity="0.4"/>
  <circle cx="200" cy="500" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="1000" cy="150" r="2.5" fill="#06b6d4" opacity="0.5"/>
  
  <!-- Main content container -->
  <rect x="80" y="120" width="1040" height="390" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Logo/Icon area -->
  <rect x="120" y="180" width="80" height="80" rx="12" fill="url(#accent-gradient)"/>
  <text x="160" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">PW</text>
  
  <!-- Main title -->
  <text x="240" y="220" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">PoseWeaver</text>
  
  <!-- Subtitle -->
  <text x="240" y="260" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24" font-weight="500">AI Co-writer for Roleplayers</text>
  
  <!-- Description -->
  <text x="120" y="320" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Elevate your storytelling in seconds with AI-powered</text>
  <text x="120" y="350" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">pose enhancement and character development</text>
  
  <!-- Feature highlights -->
  <g transform="translate(120, 390)">
    <!-- Feature 1 -->
    <circle cx="8" cy="8" r="4" fill="#8b5cf6"/>
    <text x="25" y="13" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Enhance poses with AI</text>
    
    <!-- Feature 2 -->
    <circle cx="220" cy="8" r="4" fill="#06b6d4"/>
    <text x="237" y="13" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Character development</text>
    
    <!-- Feature 3 -->
    <circle cx="440" cy="8" r="4" fill="#8b5cf6"/>
    <text x="457" y="13" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Immersive storytelling</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="80" y="550" width="1040" height="3" rx="1.5" fill="url(#accent-gradient)"/>
</svg>
