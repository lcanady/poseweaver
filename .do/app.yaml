name: poseweaver-backend
services:
- name: api
  source_dir: /backend
  github:
    repo: lcanady/edit
    branch: main
    deploy_on_push: true
  run_command: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8080
  health_check:
    http_path: /api/health
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  envs:
  - key: FLASK_ENV
    value: production
  - key: FLASK_DEBUG
    value: "False"
  - key: PORT
    value: "8080"
  - key: PYTHONPATH
    value: /app
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: JWT_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: MONGODB_URI
    scope: RUN_TIME
    type: SECRET
  - key: MONGODB_DB
    value: poseweaver
  - key: VENICE_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: VENICE_TIMEOUT
    value: "120"
  - key: STRIPE_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_PUBLISHABLE_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: FRONTEND_URL
    scope: RUN_TIME
    type: SECRET
