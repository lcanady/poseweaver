name: poseweaver-backend
services:
- name: api
  source_dir: /backend
  github:
    repo: lcanady/edit
    branch: main
    deploy_on_push: true
  run_command: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --keep-alive 300 --max-requests 1000 --max-requests-jitter 100 app:app
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xs
  http_port: 8080
  health_check:
    http_path: /api/health
    initial_delay_seconds: 60
    period_seconds: 30
    timeout_seconds: 10
    success_threshold: 1
    failure_threshold: 5
  envs:
  - key: FLASK_ENV
    value: production
  - key: FLASK_DEBUG
    value: "False"
  - key: PORT
    value: "8080"
  - key: PYTHONPATH
    value: /app
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: JWT_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: MONGODB_URI
    scope: RUN_TIME
    type: SECRET
  - key: MONGODB_DB
    value: poseweaver
  - key: OPENROUTER_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: OPENROUTER_TIMEOUT
    value: "300"
  - key: STRIPE_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_PUBLISHABLE_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: FRONTEND_URL
    scope: RUN_TIME
    type: SECRET
