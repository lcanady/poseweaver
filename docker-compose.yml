services:
  mongodb:
    image: mongo:7.0
    container_name: mush-pose-editor-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mush_pose_editor
    volumes:
      - ./backend/data:/data/db
    networks:
      - mush-pose-editor-network

  redis:
    image: redis:alpine
    container_name: mush-pose-editor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mush-pose-editor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mush-pose-editor-backend
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/mush_pose_editor?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./backend/firebase-credentials.json:/app/firebase-credentials.json
    command: python app.py
    depends_on:
      - mongodb
      - redis
    networks:
      - mush-pose-editor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: mush-pose-editor-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - mush-pose-editor-network

networks:
  mush-pose-editor-network:
    driver: bridge

volumes:
  redis-data:
