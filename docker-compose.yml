version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mush-pose-editor-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mush_pose_editor
    volumes:
      - ./backend/data:/data/db
    networks:
      - mush-pose-editor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: python app.py
    depends_on:
      - mongodb
    networks:
      - mush-pose-editor-network

networks:
  mush-pose-editor-network:
    driver: bridge 