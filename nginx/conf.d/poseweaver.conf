# PoseWeaver Unified Configuration
# Supports both development (HTTP) and production (HTTPS) modes

# Define upstream servers
upstream backend {
    server backend:5001;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# HTTP Server Block
server {
    listen 80;
    server_name poseweaver.com www.poseweaver.com localhost;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Redirect to HTTPS in production (when SSL is available)
    # Comment out this block for development
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }
    
    # Development mode - serve content over HTTP
    # Comment out this section when using HTTPS redirect above
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
    }
    
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS Server Block (Production)
server {
    listen 443 ssl http2;
    server_name poseweaver.com www.poseweaver.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/poseweaver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poseweaver.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Frontend (Next.js)
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
    }
    
    # Backend API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    
    # Static files with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
